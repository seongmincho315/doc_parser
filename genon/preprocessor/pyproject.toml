[project]
name = "doc-parser-preprocessor"
version = "1.3.0"
description = ""
authors = [{ name = "Seunghyun Nam", email = "seunghyun.nam@genon.ai" }]
requires-python = '>=3.11,<4.0'
dependencies = [
    "docling-core==2.85.0",
    "docling-parse==7.3.0",
    "python-multipart==0.0.22",
    "gunicorn==23.0.0",
    "uvicorn==0.21.1",
    "pyarrow==22.0.0",
    "starlette>=0.52.1",
    "aiofiles==24.1.0",
    "aiohttp==3.13.3",
    "httpx>=0.27.0",
    "transformers==4.57.6",
    "unstructured==0.18.32",
    "python-pptx==1.0.2",
    "python-docx==1.1.2",
    "python-magic==0.4.27",
    "pyhwp==0.1b15",
    "markdown==3.8.2",
    "pydub==0.25.1",
    "weasyprint==68.1",
    "aiofile==3.9.0",
    "watchfiles==1.1.0",
    "pika==1.3.2",
    "chardet==5.2.0",
    'wand',
    'grpcio',
    'grpcio-tools',
    "fastapi>=0.115.12",
    "pymupdf>=1.26.4",
    "pydub>=0.25.1",
    "langchain>=1.2.10",
    "langchain-core>=1.2.11",
    "langchain-community>=0.4.1",
    "numpy>=2.3.4",
    "markdown2>=2.5.4",
    "audioop-lts; python_version >= '3.13'",
    "pdfminer-six==20250506",
    "docling",
    "hatchling>=1.27.0",
    "pi-heif==0.22.0",
    # unstructured-inference / unstructured-pytesseract 는 제거했다 — 이미지(JPG/PNG)와
    # 미지 확장자의 hi_res 파싱(YOLOX+Table Transformer)은 이제 별도 파드(genon/serving/
    # unstructured_hires)로만 서빙된다(RemoteHiResLoader).
    # docling-ibm-models / accelerate 도 제거했다 — TableFormer 등은 이미 파드로 분리됐고,
    # 유일하게 무조건 쓰던 ReadingOrderModel의 두 서브모듈(pure-python)은
    # docling/utils/{reading_order_rb,list_marker_processor}.py 로 벤더링해서 대체.
    # accelerate는 genon/ 어디서도 안 쓰임(transformers는 AutoTokenizer만 써서 torch 불필요).
    # 이제 doc-parser 본체에 torch가 안 남는다(uv.lock 재생성 확인 완료).
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    # opencv-python(GUI) 대신 headless로 직접 건다 — 예전엔 unstructured-inference/
    # docling-ibm-models/easyocr가 비headless를 끌고 와서 Dockerfile 빌드 단계에서
    # uninstall→headless 재설치를 수동으로 했는데(opencv_python.libs 중복 제거,
    # ~116MB), 그것들을 다 뺀 지금은 이 줄이 유일한 opencv 의존성이라 처음부터
    # headless로 받으면 그 재설치 단계 자체가 필요 없다. 첫 파티 코드에 import cv2 없음.
    "opencv-python-headless>=4.11.0.86",
    "numpy==2.3.4",
    "minio==7.2.20",
]

[dependency-groups]
dev = [
    "pre-commit~=3.7",
    "mypy~=1.10",
    "types-setuptools~=70.3",
    "pandas-stubs~=2.1",
    "types-openpyxl~=3.1",
    "types-requests~=2.31",
    "boto3-stubs~=1.37",
    "types-urllib3~=1.26",
    "types-tqdm~=4.67",
    "coverage~=7.6",
    "pytest~=8.4.2",
    "pytest-cov>=6.1.1",
    "pytest-dependency~=0.6",
    "pytest-xdist~=3.3",
    "ipykernel~=6.29",
    "ipywidgets~=8.1",
    "nbqa~=1.9",
    "python-semantic-release~=7.32",
    "pytest-asyncio>=1.2.0",
    "apted>=1.0.3"
]

[tool.uv.sources]
docling = [
    { path = "../.." }
]

[tool.hatch.build.targets.sdist]
include = ["src/**/*", "*.json"]

[tool.hatch.build.targets.wheel]
include = ["src/**/*", "*.json"]

[tool.hatch.build.targets.wheel.sources]
"src/**/*" = "*"
"*.json" = "*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m \"not update_baseline\""
markers = [
    "smoke: 핵심 경로가 죽지 않는지 빠르게 확인하는 smoke 테스트",
    "unit: 격리된 함수/클래스 단위 테스트",
    "regression: baseline과 비교하여 회귀를 감지하는 테스트",
    "update_baseline: baseline 데이터를 (재)생성하는 유틸리티 (일반 실행에서 제외)",
]

[tool.hatch.metadata]
allow-direct-references = true  # Direct reference 허용
